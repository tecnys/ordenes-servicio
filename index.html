<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Servicios - CECAMET</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #2c5f7f; margin-bottom: 30px; font-size: 24px; }
        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            margin: 15px 0;
            background: #2c5f7f;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            transition: background 0.2s;
            box-sizing: border-box;
        }
        .btn:hover { background: #1e4159; }
        .btn-secondary { background: #28a745; }
        .btn-secondary:hover { background: #1e7e34; }
        p { color: #666; font-size: 14px; margin-top: 25px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Portal de Servicios TI - CECAMET</h1>
        
        <a href="Solicitud.html" class="btn">📝 Solicitar Servicio</a>
        <a href="Admin.html" class="btn btn-secondary">🔧 Panel del Técnico</a>
        
        <p>Selecciona una opción para continuar.</p>
    </div>
</body>
</html>
